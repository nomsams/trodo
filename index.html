<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Trodo - Spatial Kanban</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            /* Sleek FAANG-level Palette */
            --bg-color: #f0f0f3;
            --text-color: #1d1d1f;
            --col-bg: rgba(225, 225, 230, 0.5);
            --note-bg: rgba(255, 255, 255, 0.98);
            --border-color: rgba(210, 210, 215, 0.8);
            --accent-color: #0066cc;
            --urgent-color: #ff3b30;
            --done-color: #34c759;
            --shadow: 0 8px 24px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.04);
            --glass-blur: blur(20px);
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        [data-theme="dark"] {
            --bg-color: #0a0a0c;
            --text-color: #f5f5f7;
            --col-bg: rgba(28, 28, 30, 0.6);
            --note-bg: rgba(44, 44, 46, 0.98);
            --border-color: rgba(72, 72, 74, 0.6);
            --accent-color: #0a84ff;
            --shadow: 0 12px 32px rgba(0,0,0,0.6), 0 4px 12px rgba(0,0,0,0.4);
        }

        * { 
            box-sizing: border-box; margin: 0; padding: 0; 
            /* Firefox Scrollbars */
            scrollbar-width: thin; 
            scrollbar-color: var(--border-color) transparent;
        }
        
        body { font-family: var(--font-family); background: var(--bg-color); color: var(--text-color); overflow: hidden; display: flex; flex-direction: column; height: 100vh; transition: background-color 0.3s, color 0.3s; padding-bottom: env(safe-area-inset-bottom, 20px); }
        
        button { cursor: pointer; border: none; background: var(--col-bg); color: var(--text-color); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; transition: var(--transition); border: 1px solid var(--border-color); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); }
        button:hover { filter: brightness(1.15); transform: scale(1.03); }
        button:active { transform: scale(0.96); }
        button.primary { background: var(--accent-color); color: white; border-color: var(--accent-color); }
        
        input, select, textarea { background: var(--col-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; font-family: inherit; font-size: 13px; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-color); }
        
        /* Webkit Scrollbars (Chrome/Safari/Edge) */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }
        
        /* Top Bar Layout */
        #top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: transparent; z-index: 100; position: absolute; top:0; left:0; right:0; padding-top: max(15px, env(safe-area-inset-top)); pointer-events: none; }
        .top-group { display: flex; align-items: center; gap: 10px; background: var(--col-bg); padding: 6px 12px; border-radius: 14px; backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--border-color); box-shadow: var(--shadow); pointer-events: auto; }
        .top-center { position: absolute; left: 50%; transform: translateX(-50%); }
        @media (max-width: 768px) { .top-center { position: static; transform: none; } }
        
        /* Premium Trodo Logo */
        .brand-logo { font-size: 24px; font-weight: 900; background: linear-gradient(135deg, #FF2A54, #FF9A44, #b266ff); background-size: 200% 200%; animation: gradient-shift 4s ease infinite; -webkit-background-clip: text; color: transparent; letter-spacing: -1.5px; margin-right: 8px; transform: skewX(-6deg); filter: drop-shadow(0 2px 4px rgba(255,42,84,0.3)); cursor: default; user-select: none; }
        @keyframes gradient-shift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        .id-display { font-size: 12px; opacity: 0.8; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: background 0.2s; font-family: monospace; border: 1px dashed transparent; font-weight: 600; }
        .id-display:hover { background: rgba(128,128,128,0.2); border-color: var(--border-color); }

        #users-container { display: flex; gap: -5px; align-items: center; margin-left: 5px; padding-left: 10px; border-left: 1px solid var(--border-color); }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-color); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; cursor: pointer; position: relative; border: 2px solid var(--col-bg); box-shadow: var(--shadow); transition: transform 0.2s; margin-left: -8px; }
        .user-avatar:hover { transform: scale(1.15) translateY(-2px); z-index: 10 !important; }
        .user-avatar .tooltip { visibility: hidden; position: absolute; top: 120%; right: 50%; transform: translateX(50%); background: var(--text-color); color: var(--bg-color); padding: 6px 10px; border-radius: 6px; font-size: 11px; white-space: nowrap; opacity: 0; transition: opacity 0.2s; font-weight: normal; z-index: 100; text-align: center; line-height: 1.4; pointer-events: none;}
        .user-avatar:hover .tooltip { visibility: visible; opacity: 1; }

        /* Board Area */
        #board-container { flex: 1; overflow: hidden; position: relative; cursor: grab; margin-top: 70px; }
        #board-container:active { cursor: grabbing; }
        #canvas-wrapper { display: flex; gap: 24px; padding: 20px 40px; min-width: 100%; width: max-content; height: calc(100% - 40px); transform-origin: 0 0; transition: transform 0.05s linear; }
        
        /* Columns */
        .column { background: var(--col-bg); border-radius: 18px; display: flex; flex-direction: column; padding: 18px; gap: 15px; border: 1px solid var(--border-color); box-shadow: var(--shadow); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); transition: flex-basis 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); width: 320px; flex-shrink: 0; }
        .column-header { font-weight: 800; font-size: 13px; display: flex; justify-content: space-between; align-items: center; letter-spacing: 0.5px; color: var(--text-color); position: relative; min-height: 24px; opacity: 0.9; text-transform: uppercase;}
        
        .column-content { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 14px; min-height: 200px; padding: 4px; padding-bottom: 30px; margin: -4px; }
        
        /* Layout Grid Ratios */
        @media (min-width: 1024px) {
            .column { width: auto; flex-shrink: 1; }
            #col-todo, #col-done { flex: 1 1 25%; }
            #col-in-progress { flex: 1 1 50%; }
            #col-review { flex: 1 1 25%; display: none; }
            body.review-enabled #col-todo, body.review-enabled #col-done { flex: 1 1 20%; }
            body.review-enabled #col-in-progress, body.review-enabled #col-review { flex: 1 1 30%; }
            body.review-enabled #col-review { display: flex; }
        }

        /* The Packing/Shipping Loader (In Progress Column Header) */
        .col-loader { width: 90px; height: 14px; box-shadow: 0 3px 0 var(--text-color); position: absolute; left: 50%; transform: translateX(-50%); display: none; clip-path: inset(-60px 0 -5px); opacity: 0.6; }
        .col-loader:after { content: ""; position: absolute; inset:0; background: repeating-linear-gradient(90deg, transparent 0 calc(50% - 8px), var(--border-color) 0 calc(50% + 8px), transparent 0 100%) 0 0/calc(100%/3) 100%; animation: l6-1 3s infinite linear; z-index: 1;}
        .col-loader:before { content: ""; position: absolute; width: 14px; aspect-ratio: 1; left: calc(50% - 7px); bottom: 0; background: var(--accent-color); animation: l6-2 2.5s infinite cubic-bezier(0.2, 0.8, 0.2, 1), shape-shift 10s infinite alternate; z-index: -1;}
        @keyframes l6-1 { 50%,100% {background-position: calc(100%/2) 0} }
        @keyframes l6-2 { 0%,50% {transform:translateY(-80px)} }
        @keyframes shape-shift { 
            0%, 15% { border-radius: 50%; clip-path: none; } /* Circle */
            20%, 35% { border-radius: 4px; clip-path: none; } /* Square */
            40%, 55% { border-radius: 0; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); } /* Triangle */
            60%, 75% { border-radius: 0; clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); } /* Pentagon */
            80%, 100% { border-radius: 0; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); } /* Star */
        }

        /* Sticky Notes */
        .note { background: var(--note-bg); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); cursor: pointer; border: 1px solid var(--border-color); position: relative; transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s, outline 0.1s; display: flex; flex-direction: column; gap: 8px; z-index: 1; transform-origin: center; }
        
        .note:hover, .note.hover-focus { transform: scale(1.02); box-shadow: 0 16px 32px rgba(0,0,0,0.15); z-index: 50; }
        .note.dragging { opacity: 0.6; transform: scale(0.95) rotate(var(--rot, 0deg)); z-index: 100; box-shadow: 0 24px 48px rgba(0,0,0,0.3); pointer-events: none; }
        
        /* Drop Target Spacer */
        .drop-spacer { height: 4px; background: var(--accent-color); border-radius: 2px; margin: 4px 0; transition: all 0.2s; opacity: 0; }
        
        .note-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .note-subject { font-weight: 700; font-size: 14px; word-break: break-word; outline: none; border-radius: 4px; transition: background 0.2s; padding: 2px 4px; margin: -2px -4px; }
        .note-desc { font-size: 12px; opacity: 0.8; word-break: break-word; outline: none; border-radius: 4px; transition: background 0.2s; padding: 2px 4px; margin: -2px -4px; }
        
        .note-desc.empty-desc { opacity: 0.4; font-style: italic; min-height: 20px; }
        .note-subject.editing, .note-desc.editing { background: rgba(128,128,128,0.15); box-shadow: inset 0 0 0 1px var(--accent-color); cursor: text; font-style: normal; opacity: 1; }
        .note-desc:not(.editing) { max-height: 60px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
        
        .note-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--border-color); position: relative; min-height: 28px;}
        .note-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
        .tag { background: rgba(128,128,128,0.15); padding: 3px 6px; border-radius: 4px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .note.priority-urgent { border-left: 4px solid var(--urgent-color); }
        .note.status-done { background: rgba(52, 199, 89, 0.05); border-color: rgba(52, 199, 89, 0.3); }
        .note.paused { filter: grayscale(100%); opacity: 0.7; }

        /* Dynamic Progress Bar */
        .progress-wrapper { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: rgba(128,128,128,0.1); border-radius: 0 0 12px 12px; overflow: hidden; }
        .progress-fill { position: absolute; top: 0; left: 0; height: 100%; width: var(--p, 0%); background: var(--accent-color); transition: width 1s linear; }
        .progress-mask { position: absolute; inset: 0; -webkit-mask: radial-gradient(circle closest-side, #000 90%, #0000) 0 0/var(--dot-size, 20%) 100%, linear-gradient(#000 0 0) center/calc(100% - 6px) 100% no-repeat; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent); background-size: 200% 100%; animation: p-shimmer 2s infinite linear; pointer-events: none; }
        @keyframes p-shimmer { 0% {background-position: 200% 0;} 100% {background-position: -200% 0;} }

        /* Quick Move Hover Button - Perfectly overlays the spinner */
        .quick-move-btn { 
            position: absolute; 
            right: 10px; 
            bottom: 10px; 
            width: 24px; 
            height: 24px; 
            border-radius: 50%; 
            background: var(--accent-color); 
            color: white; 
            display: none; 
            justify-content: center; 
            align-items: center; 
            font-weight: bold; 
            font-size: 14px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
            z-index: 60; 
            border: 2px solid var(--note-bg); 
            transition: transform 0.1s; 
        }
        .quick-move-btn:hover { transform: scale(1.15); }
        .note:hover .quick-move-btn { display: flex; }

        /* Status Animations (Mini Loaders) */
        .mini-loader { position: relative; width: 14px; aspect-ratio: 1; display: none; flex-shrink: 0; margin-left: auto; }
        
        .l-urgent { --_g: no-repeat radial-gradient(farthest-side, currentColor 94%, #0000); background: var(--_g) 0 0, var(--_g) 100% 0, var(--_g) 100% 100%, var(--_g) 0 100%; background-size: 40% 40%; animation: l38 0.5s infinite; color: var(--urgent-color); }
        @keyframes l38 { 100% {background-position: 100% 0, 100% 100%, 0 100%, 0 0} }

        .l-default { width: 16px; aspect-ratio: 1.154; --_g: no-repeat radial-gradient(farthest-side, currentColor 90%, #0000); background: var(--_g) 50% 0, var(--_g) 0 100%, var(--_g) 100% 100%; background-size: 35% calc(35%*1.154); animation: l16 1s infinite; color: var(--accent-color); }
        @keyframes l16 { 50%,100% {background-position: 100% 100%, 50% 0, 0 100%} }
        
        .l-low { width: 16px; aspect-ratio: 1.154; --_g: no-repeat radial-gradient(farthest-side, currentColor 90%, #0000); background: var(--_g) 50% 0, var(--_g) 0 100%, var(--_g) 100% 100%; background-size: 35% calc(35%*1.154); animation: l16 2s infinite; color: var(--text-color); opacity: 0.6; }

        /* Floating Chat */
        #chat-fab { position: fixed; bottom: max(25px, env(safe-area-inset-bottom)); right: 25px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent-color); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 10px 24px rgba(10, 132, 255, 0.4); cursor: pointer; z-index: 200; transition: transform 0.2s; border: none; }
        #chat-fab:hover { transform: scale(1.1); }
        #chat-badge { position: absolute; top: 0; right: 0; width: 16px; height: 16px; background: var(--urgent-color); border-radius: 50%; display: none; border: 2px solid var(--bg-color); }
        
        #chat-panel { position: fixed; right: 25px; bottom: calc(max(25px, env(safe-area-inset-bottom)) + 70px); width: 320px; height: 420px; background: var(--note-bg); border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); display: flex; flex-direction: column; z-index: 190; transform: scale(0.9); opacity: 0; pointer-events: none; transition: var(--transition); transform-origin: bottom right; }
        #chat-panel.open { transform: scale(1); opacity: 1; pointer-events: auto; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
        .chat-msg { background: var(--col-bg); padding: 10px 14px; border-radius: 14px; border: 1px solid var(--border-color); width: fit-content; max-width: 85%; }
        .chat-msg.self { align-self: flex-end; background: var(--accent-color); color: white; border: none; }
        .chat-msg span.time { font-size: 9px; opacity: 0.6; display: block; margin-top: 4px; }
        #chat-input-area { padding: 12px; display: flex; gap: 8px; border-top: 1px solid var(--border-color); }
        #chat-input { flex: 1; border-radius: 20px; padding: 10px 16px; }

        /* Logger Window */
        #logger-window { position: fixed; top: calc(70px + env(safe-area-inset-top)); right: 25px; width: 350px; max-height: 250px; background: rgba(0,0,0,0.85); color: #0f0; font-family: monospace; font-size: 11px; border-radius: 12px; z-index: 250; display: none; flex-direction: column; border: 1px solid rgba(255,255,255,0.1); box-shadow: var(--shadow); backdrop-filter: blur(10px); pointer-events: auto;}
        #logger-header { padding: 8px 12px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); color: #fff; }
        #logger-content { flex: 1; overflow-y: auto; padding: 10px; white-space: pre-wrap; }

        /* Overlays & Modals */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 500; opacity: 0; transition: opacity 0.2s; }
        .overlay.active { display: flex; opacity: 1; }
        
        .modal { background: var(--bg-color); padding: 24px; border-radius: 20px; width: 440px; max-width: 92%; box-shadow: 0 32px 64px rgba(0,0,0,0.4); border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 16px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { font-size: 11px; font-weight: 700; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; grid-column: 1 / -1; border-top: 1px solid var(--border-color); padding-top: 16px;}

        /* Custom Toast */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 1000; pointer-events: none; }
        .toast { background: var(--text-color); color: var(--bg-color); padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; box-shadow: 0 8px 20px rgba(0,0,0,0.2); animation: toast-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes toast-in { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes toast-out { to { transform: translateY(-20px); opacity: 0; } }

        /* Improved Color Picker */
        .color-swatches { display: flex; gap: 6px; align-items: center; }
        .swatch { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); }
        .swatch:hover { transform: scale(1.2); }
        .swatch.selected { border-color: var(--text-color); box-shadow: 0 0 0 2px var(--bg-color) inset, 0 0 0 1px var(--text-color) inset; }

        /* Context Menu */
        #context-menu { position: absolute; background: var(--note-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--border-color); box-shadow: var(--shadow); border-radius: 12px; padding: 6px; display: none; flex-direction: column; min-width: 160px; z-index: 400; }
        #context-menu button { background: transparent; border: none; text-align: left; padding: 10px 12px; border-radius: 6px; box-shadow: none; font-size: 13px; margin: 1px 0; font-weight: 500;}
        #context-menu button:hover { background: var(--accent-color); color: white; }
        #context-menu button.danger:hover { background: var(--urgent-color); }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="top-group" style="background: transparent; border: none; box-shadow: none;">
            <div class="brand-logo">Trodo</div>
        </div>

        <!-- Centered Join UI -->
        <div class="top-group top-center">
            <input type="text" id="peer-id-input" placeholder="Join ID..." style="width: 100px; padding: 6px; font-size: 12px;" oninput="app.toggleJoinBtn()">
            <button id="join-btn" onclick="app.connectToPeer()" style="padding: 6px 10px; display: none;">Join</button>
            <div style="border-left: 1px solid var(--border-color); height: 16px; margin: 0 2px;"></div>
            <span class="id-display" onclick="app.editMyId()" title="Change Session ID" id="my-peer-id">...</span>
            <button onclick="app.showQR()" style="background: transparent; border: none; box-shadow: none; padding:4px;" title="Share Link">🔗</button>
        </div>

        <div class="top-group" style="background: transparent; border: none; box-shadow: none; padding:0;">
            <div class="top-group">
                <button onclick="app.toggleTheme()" style="background:transparent; border:none; box-shadow:none; font-size:16px; padding:4px;">🌓</button>
                <label style="font-size: 12px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-weight:600;">
                    <input type="checkbox" id="toggle-review" onchange="app.toggleReviewColumn(this.checked)"> Review
                </label>
                <div style="border-left: 1px solid var(--border-color); height: 16px; margin: 0 2px;"></div>
                <button onclick="app.exportState()" style="background:transparent; border:none; box-shadow:none; padding:4px;" title="Export JSON">⬇️</button>
                <button onclick="document.getElementById('import-file').click()" style="background:transparent; border:none; box-shadow:none; padding:4px;" title="Import JSON">⬆️</button>
                <input type="file" id="import-file" style="display: none;" accept=".json" onchange="app.importState(event)">
                <button onclick="app.toggleLogger()" style="background:transparent; border:none; box-shadow:none; padding:4px;" title="Console Logs">📋</button>
                
                <div id="users-container"></div>
            </div>
        </div>
    </div>

    <div id="logger-window">
        <div id="logger-header">
            <span>System Logs</span>
            <div>
                <button onclick="app.copyLogs(event)" style="padding: 2px 6px; font-size: 10px; background:transparent; border:1px solid #555; color:#fff;">Copy</button>
                <button onclick="app.toggleLogger()" style="padding: 2px 6px; font-size: 10px; background:transparent; border:none; color:#fff;">✕</button>
            </div>
        </div>
        <div id="logger-content"></div>
    </div>

    <div id="toast-container"></div>

    <div id="board-container">
        <div id="canvas-wrapper">
            <div class="column" id="col-todo">
                <div class="column-header">
                    <span>TODO</span>
                    <button onclick="app.openNoteModal()" class="primary" style="padding: 4px 10px; border-radius: 6px;">+</button>
                </div>
                <div class="column-content" data-status="todo"></div>
            </div>
            
            <div class="column" id="col-in-progress">
                <div class="column-header">
                    <span>IN PROGRESS</span>
                    <div class="col-loader" id="main-progress-loader"></div>
                </div>
                <div class="column-content" data-status="in-progress"></div>
            </div>

            <div class="column" id="col-review">
                <div class="column-header">REVIEW</div>
                <div class="column-content" data-status="review"></div>
            </div>

            <div class="column" id="col-done">
                <div class="column-header">DONE</div>
                <div class="column-content" data-status="done"></div>
            </div>
        </div>
    </div>

    <button id="chat-fab" onclick="app.toggleChat()">💬<div id="chat-badge"></div></button>

    <div id="chat-panel">
        <div style="padding: 15px; font-weight: 700; border-bottom: 1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
            Team Chat <span onclick="app.toggleChat()" style="cursor:pointer; opacity:0.5; font-size:12px; padding:4px;">✕</span>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Message...">
            <button id="chat-send-btn" class="primary" style="border-radius:20px; padding: 8px 16px;">></button>
        </div>
    </div>

    <div id="context-menu">
        <button onclick="app.ctxQuickEdit()">✏️ Quick Edit</button>
        <button onclick="app.ctxFullEdit()">📝 Full Edit</button>
        <div style="height:1px; background:var(--border-color); margin: 4px 0;"></div>
        <button class="danger" onclick="app.ctxDelete()">🗑 Delete</button>
    </div>

    <div id="dialog-overlay" class="overlay">
        <div class="modal" style="width: 340px;">
            <h3 id="dialog-title">Prompt</h3>
            <p id="dialog-msg" style="font-size: 13px; opacity: 0.8;"></p>
            <input type="text" id="dialog-input" style="display:none; width:100%;">
            
            <div id="dialog-qr-view" style="display:none; text-align:center; margin-top: 10px;">
                <img id="qr-image" src="" alt="QR" style="width: 160px; height: 160px; border-radius: 12px; background: white; padding: 10px; margin-bottom:10px; box-shadow: var(--shadow);">
                <input type="text" id="share-url" readonly style="width: 100%; text-align: center; font-size: 11px; cursor:pointer;" onclick="this.select(); document.execCommand('copy'); app.toast('URL Copied!');">
            </div>

            <div class="modal-actions" style="margin-top: 10px;">
                <button id="dialog-cancel" style="background:transparent; border-color:transparent;">Cancel</button>
                <button id="dialog-ok" class="primary">Confirm</button>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="overlay" onmousedown="if(event.target===this) app.closeModal()">
        <div class="modal">
            <h3 id="modal-title" style="margin-bottom: -4px;">Edit Card</h3>
            <input type="hidden" id="note-id">
            
            <div class="form-grid">
                <div class="form-group full">
                    <input type="text" id="note-subject" placeholder="Task Subject..." style="font-size: 16px; font-weight: 700; padding:12px;" required>
                </div>
                
                <div class="form-group full">
                    <textarea id="note-desc" rows="2" placeholder="Description (Optional)"></textarea>
                </div>

                <div class="form-group">
                    <label>Color</label>
                    <div class="color-swatches">
                        <div class="swatch selected" style="background:var(--note-bg);" onclick="app.selectColor(this, '')"></div>
                        <div class="swatch" style="background:rgba(255, 59, 48, 0.15);" onclick="app.selectColor(this, 'rgba(255, 59, 48, 0.15)')"></div>
                        <div class="swatch" style="background:rgba(52, 199, 89, 0.15);" onclick="app.selectColor(this, 'rgba(52, 199, 89, 0.15)')"></div>
                        <div class="swatch" style="background:rgba(0, 102, 204, 0.15);" onclick="app.selectColor(this, 'rgba(0, 102, 204, 0.15)')"></div>
                        <input type="color" id="note-color-picker" style="width: 24px; height: 24px; padding:0; border:none; border-radius:50%; cursor:pointer;" onchange="app.selectColor(null, this.value)">
                    </div>
                </div>

                <div class="form-group">
                    <label>Priority</label>
                    <select id="note-priority">
                        <option value="default">Default</option>
                        <option value="urgent">Urgent</option>
                        <option value="low">Low</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tags (Ctrl+Click)</label>
                    <select id="note-tags" multiple size="3" style="height: 60px;">
                        <option value="offert">offert</option>
                        <option value="möte">möte</option>
                        <option value="skicka">skicka</option>
                        <option value="brådskande">brådskande</option>
                        <option value="granskning">granskning</option>
                        <option value="faktura">faktura</option>
                        <option value="design">design</option>
                        <option value="bugg">bugg</option>
                        <option value="SMM-post">SMM-post</option>
                    </select>
                </div>

                <div class="form-group" style="justify-content: flex-end;">
                    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                        <input type="checkbox" id="enable-time" onchange="document.getElementById('note-time').disabled = !this.checked">
                        Estimate (Hrs)
                    </label>
                    <input type="number" id="note-time" value="1" min="0.1" step="0.1" disabled placeholder="e.g. 1.5">
                </div>

                <div class="modal-actions">
                    <button onclick="app.closeModal()" style="background:transparent; border-color:transparent;">Cancel</button>
                    <button class="primary" onclick="app.saveNote()">Save Task</button>
                </div>
            </div>
        </div>
    </div>

<script>
const CORS_CONFIG = {
  providers: { lovable: "https://onbkfqayveownervyktu.supabase.co/functions/v1/cors-proxy", corsproxy: "https://corsproxy.io/?" },
  settings: { useProxy: true } 
};
async function fetchWithProxyFallback(url) {
  try { const res = await fetch(CORS_CONFIG.providers.corsproxy + encodeURIComponent(url)); return await res.json(); } catch(e) { return null; }
}

const Logger = {
    log: (msg, type='INFO') => {
        const time = new Date().toLocaleTimeString();
        const content = document.getElementById('logger-content');
        if(content) {
            content.innerHTML += `<div><span style="color:#888;">[${time}]</span> <span style="color:${type==='ERROR'?'#f55':'#0f0'};">[${type}]</span> ${msg}</div>`;
            content.scrollTop = content.scrollHeight;
        }
        console.log(`[${type}] ${msg}`);
    }
};

const app = {
    state: { notes: {}, users: {}, chat: [], settings: { reviewEnabled: false } },
    localNicknames: {},
    myId: null, peer: null, connections: {},
    transform: { scale: 1, x: 0, y: 0 },
    isPanning: false, startX: 0, startY: 0,
    hoveredNoteId: null, ctxNoteId: null,
    unreadChat: 0, selectedColor: '',
    isTabActive: true, hasUnseenChanges: false,

    init: async function() {
        this.loadState();
        this.setupTheme();
        this.setupPanZoom();
        this.setupDragAndDrop();
        this.setupShortcuts();
        this.setupChatEvents();
        this.renderAll();
        setInterval(() => this.updateProgressUI(), 1000);

        // Favicon Visibility Tracking
        window.addEventListener('focus', () => { 
            this.isTabActive = true; 
            this.hasUnseenChanges = false; 
            this.updateFavicon(); 
        });
        window.addEventListener('blur', () => { 
            this.isTabActive = false; 
        });
        this.updateFavicon();

        // Context Menu Cleanup
        window.addEventListener('mousedown', (e) => {
            const menu = document.getElementById('context-menu');
            if (menu && menu.style.display === 'flex') {
                if (!e.target.closest('.note') && !e.target.closest('#context-menu')) {
                    menu.style.display = 'none';
                }
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        this.initPeer(urlParams.get('myid'), urlParams.get('room'));
    },

    updateFavicon: function() {
        const color = this.hasUnseenChanges ? '#ff9a44' : '#34c759';
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="${color}"/></svg>`;
        const url = `data:image/svg+xml;base64,${btoa(svg)}`;
        let link = document.querySelector("link[rel~='icon']");
        if (!link) {
            link = document.createElement('link');
            link.rel = 'icon';
            document.head.appendChild(link);
        }
        link.href = url;
    },

    toggleJoinBtn: function() {
        const input = document.getElementById('peer-id-input');
        const btn = document.getElementById('join-btn');
        btn.style.display = input.value.trim().length > 0 ? 'block' : 'none';
    },

    setupChatEvents: function() {
        const input = document.getElementById('chat-input');
        const btn = document.getElementById('chat-send-btn');
        const panel = document.getElementById('chat-panel');

        panel.addEventListener('mousedown', (e) => e.stopPropagation());

        input.addEventListener('keydown', (e) => {
            e.stopPropagation();
            if(e.key === 'Enter') {
                e.preventDefault();
                this.sendChat();
            }
        });
        input.addEventListener('mousedown', (e) => e.stopPropagation());
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.sendChat();
        });
    },

    // --- DOM MODAL & UI UTILS ---
    toast: function(msg) {
        const c = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = 'toast'; t.innerText = msg;
        c.appendChild(t);
        setTimeout(() => { t.style.animation = 'toast-out 0.3s forwards'; setTimeout(()=>t.remove(), 300); }, 3000);
    },

    dialog: function({title, msg, type='alert', defaultVal='', showQR=null}, callback) {
        const over = document.getElementById('dialog-overlay');
        const okBtn = document.getElementById('dialog-ok');
        const cancelBtn = document.getElementById('dialog-cancel');
        const input = document.getElementById('dialog-input');
        const qrView = document.getElementById('dialog-qr-view');
        
        document.getElementById('dialog-title').innerText = title;
        document.getElementById('dialog-msg').innerText = msg;
        document.getElementById('dialog-msg').style.display = msg ? 'block' : 'none';
        
        input.style.display = type === 'prompt' ? 'block' : 'none';
        input.value = defaultVal;
        cancelBtn.style.display = (type === 'alert' && !showQR) ? 'none' : 'block';
        qrView.style.display = showQR ? 'block' : 'none';

        if(showQR) {
            document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(showQR)}`;
            document.getElementById('share-url').value = showQR;
            okBtn.style.display = 'none';
            cancelBtn.innerText = 'Close';
            cancelBtn.style.display = 'block';
        } else {
            okBtn.style.display = 'block';
            cancelBtn.innerText = 'Cancel';
        }

        const close = () => { over.classList.remove('active'); setTimeout(()=>over.style.display='none', 200); };
        
        over.style.display = 'flex';
        void over.offsetWidth; 
        over.classList.add('active');

        if(type === 'prompt') input.focus();

        okBtn.onclick = () => { close(); if(callback) callback(type === 'prompt' ? input.value : true); };
        cancelBtn.onclick = () => { close(); if(callback) callback(type === 'prompt' ? null : false); };
    },

    confirm: function(msg, callback) { this.dialog({title: 'Confirm Action', msg, type: 'confirm'}, res => { if(res) callback(); }); },
    promptUser: function(title, msg, defaultVal, callback) { this.dialog({title, msg, type: 'prompt', defaultVal}, callback); },

    // --- PEER JS ---
    initPeer: function(customId = null, autoConnectTo = null) {
        if(this.peer) this.peer.destroy();
        Logger.log(`Init PeerJS${customId ? ' [ID: '+customId+']' : ''}...`);
        this.peer = customId ? new Peer(customId) : new Peer();
        
        this.peer.on('error', (err) => {
            Logger.log(`Peer Error: ${err.type}`, 'ERROR');
            if(err.type === 'unavailable-id') { this.toast('ID taken. Using random.'); this.initPeer(); }
        });
        
        this.peer.on('open', async (id) => {
            this.myId = id;
            document.getElementById('my-peer-id').innerText = id;
            if (!this.state.users[id]) this.state.users[id] = { id, name: 'User_' + id.substring(0,3), ip: 'Local' };
            this.renderUsers();
            
            if(autoConnectTo && autoConnectTo !== id) {
                setTimeout(() => { document.getElementById('peer-id-input').value = autoConnectTo; this.connectToPeer(); }, 800);
            }
            this.fetchGeoLocation();
        });

        this.peer.on('connection', (conn) => this.setupConnection(conn));
    },

    editMyId: function() {
        this.promptUser("Session ID", "Enter new ID (will drop current connections):", this.myId, val => {
            if(val && val.trim() !== this.myId) { this.connections = {}; this.initPeer(val.trim()); }
        });
    },

    showQR: function() {
        const url = `${window.location.origin}${window.location.pathname}?room=${this.myId}`;
        this.dialog({title: "Invite Team", msg: "Scan or share this URL.", type: 'alert', showQR: url});
    },

    // --- KEYBOARD SHORTCUTS ---
    setupShortcuts: function() {
        document.addEventListener('keydown', (e) => {
            if(e.target.isContentEditable && e.key === 'Enter') { e.target.blur(); return; }
            
            // Handle Enter key for Modals/Dialogs
            if (e.key === 'Enter') {
                const dialog = document.getElementById('dialog-overlay');
                if (dialog.classList.contains('active')) {
                    document.getElementById('dialog-ok').click();
                    e.preventDefault();
                    return;
                }
                const modal = document.getElementById('modal-overlay');
                if (modal.classList.contains('active') && e.target.tagName !== 'TEXTAREA') {
                    this.saveNote();
                    e.preventDefault();
                    return;
                }
            }

            if(['INPUT', 'TEXTAREA'].includes(e.target.tagName) && e.key !== 'Escape') return;

            if (e.key === 'Escape') {
                this.closeModal();
                document.getElementById('context-menu').style.display = 'none';
                document.getElementById('chat-panel').classList.remove('open');
            }

            if (this.hoveredNoteId && !e.target.isContentEditable && !['INPUT','TEXTAREA'].includes(e.target.tagName)) {
                const note = this.state.notes[this.hoveredNoteId];
                if(!note) return;
                
                const cols = ['todo', 'in-progress', document.body.classList.contains('review-enabled')?'review':null, 'done'].filter(Boolean);
                let colIdx = cols.indexOf(note.status);

                if (e.key === 'ArrowRight' && colIdx < cols.length - 1) this.moveNoteNetwork(note, cols[colIdx + 1]);
                else if (e.key === 'ArrowLeft' && colIdx > 0) this.moveNoteNetwork(note, cols[colIdx - 1]);
                else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                    const noteEl = document.getElementById(`note-${note.id}`);
                    const colContent = noteEl.closest('.column-content');
                    const siblings = Array.from(colContent.querySelectorAll('.note'));
                    const currentIndex = siblings.indexOf(noteEl);
                    
                    if(e.key === 'ArrowUp' && currentIndex > 0) {
                        const targetNoteId = siblings[currentIndex - 1].dataset.id;
                        const targetNote = this.state.notes[targetNoteId];
                        let temp = note.orderIndex || 0;
                        note.orderIndex = targetNote.orderIndex || 0;
                        targetNote.orderIndex = temp;
                        note.timestamps.lastModified = targetNote.timestamps.lastModified = Date.now();
                        this.saveState(); this.renderNotes();
                        this.broadcast({type:'NOTE_UPDATE', note});
                        this.broadcast({type:'NOTE_UPDATE', note: targetNote});
                    } else if (e.key === 'ArrowDown' && currentIndex < siblings.length - 1) {
                        const targetNoteId = siblings[currentIndex + 1].dataset.id;
                        const targetNote = this.state.notes[targetNoteId];
                        let temp = note.orderIndex || 0;
                        note.orderIndex = targetNote.orderIndex || 0;
                        targetNote.orderIndex = temp;
                        note.timestamps.lastModified = targetNote.timestamps.lastModified = Date.now();
                        this.saveState(); this.renderNotes();
                        this.broadcast({type:'NOTE_UPDATE', note});
                        this.broadcast({type:'NOTE_UPDATE', note: targetNote});
                    }
                }
            }
        });
    },

    // --- STATE & NETWORKING ---
    loadState: function() {
        const saved = localStorage.getItem('kanban_state');
        if (saved) { try { this.state = { ...this.state, ...JSON.parse(saved) }; } catch(e){} }
        this.localNicknames = JSON.parse(localStorage.getItem('kanban_nicks') || '{}');
        document.getElementById('toggle-review').checked = this.state.settings.reviewEnabled;
        this.toggleReviewColumn(this.state.settings.reviewEnabled, false);
    },
    saveState: function() { localStorage.setItem('kanban_state', JSON.stringify(this.state)); },

    setupConnection: function(conn) {
        this.connections[conn.peer] = conn;
        conn.on('open', () => {
            this.toast(`Connected to ${conn.peer}`);
            conn.send({ type: 'FULL_STATE', state: this.state });
        });
        conn.on('data', (data) => this.handleNetworkData(data, conn.peer));
        conn.on('close', () => { delete this.connections[conn.peer]; this.renderUsers(); this.toast(`Lost ${conn.peer}`); });
    },
    connectToPeer: function() {
        const peerId = document.getElementById('peer-id-input').value.trim();
        if (!peerId || peerId === this.myId) return;
        this.setupConnection(this.peer.connect(peerId));
        document.getElementById('peer-id-input').value = '';
        this.toggleJoinBtn();
    },
    broadcast: function(payload) { Object.values(this.connections).forEach(conn => { if (conn.open) conn.send(payload); }); },

    handleNetworkData: function(data, senderId) {
        if (!this.isTabActive) {
            this.hasUnseenChanges = true;
            this.updateFavicon();
        }

        if (data.type === 'FULL_STATE') {
            for (const id in data.state.notes) {
                const rem = data.state.notes[id], loc = this.state.notes[id];
                if (!loc || rem.timestamps.lastModified > loc.timestamps.lastModified) this.state.notes[id] = rem;
            }
            if(data.state.settings && data.state.settings.reviewEnabled !== this.state.settings.reviewEnabled) {
                this.toggleReviewColumn(data.state.settings.reviewEnabled, false);
            }
            this.state.users = { ...this.state.users, ...data.state.users };
            const allChat = [...this.state.chat, ...data.state.chat];
            this.state.chat = Array.from(new Map(allChat.map(item => [`${item.time}_${item.user}`, item])).values()).sort((a,b) => a.time - b.time);
            this.saveState(); this.renderAll();
        } 
        else if (data.type === 'NOTE_UPDATE') { this.state.notes[data.note.id] = data.note; this.saveState(); this.renderNotes(); }
        else if (data.type === 'NOTE_DELETED') { delete this.state.notes[data.noteId]; this.saveState(); this.renderNotes(); }
        else if (data.type === 'USER_UPDATE') { this.state.users[data.user.id] = data.user; this.saveState(); this.renderUsers(); this.renderChat(); }
        else if (data.type === 'CHAT') {
            this.state.chat.push(data.msg);
            if(!document.getElementById('chat-panel').classList.contains('open')) {
                this.unreadChat++;
                document.getElementById('chat-badge').style.display = 'block';
            }
            this.saveState(); this.renderChat();
        }
    },

    async fetchGeoLocation() {
        const ipData = await fetchWithProxyFallback('https://api.ipify.org?format=json');
        if(!ipData) return;
        const geoData = await fetchWithProxyFallback(`https://ipapi.co/${ipData.ip}/json/`);
        if(this.state.users[this.myId] && geoData) {
            this.state.users[this.myId].ip = ipData.ip;
            this.state.users[this.myId].location = `${geoData.city||''}, ${geoData.country_name||''}`;
            this.saveState(); this.renderUsers(); this.broadcast({ type: 'USER_UPDATE', user: this.state.users[this.myId] });
        }
    },

    // --- UI RENDERING ---
    renderAll: function() { this.renderNotes(); this.renderUsers(); this.renderChat(); },

    renderUsers: function() {
        const container = document.getElementById('users-container');
        container.innerHTML = '';
        
        const renderSingleUser = (u, isMe) => {
            const displayName = this.localNicknames[u.id] || u.name;
            const el = document.createElement('div');
            el.className = 'user-avatar';
            if(isMe) el.style.border = '2px solid var(--accent-color)';
            el.innerText = displayName.charAt(0).toUpperCase();
            el.innerHTML += `<div class="tooltip">${displayName} ${isMe?'(You)':''}<br><span style="opacity:0.6;font-size:9px;">${u.location||''}</span></div>`;
            
            if(isMe) el.onclick = () => this.renameSelf();
            else el.onclick = () => this.promptUser("Nickname", `Assign local nickname for ${displayName}:`, displayName, val => {
                if(val) { this.localNicknames[u.id] = val; localStorage.setItem('kanban_nicks', JSON.stringify(this.localNicknames)); this.renderUsers(); this.renderChat(); }
            });
            container.appendChild(el);
        };

        if(this.state.users[this.myId]) renderSingleUser(this.state.users[this.myId], true);
        Object.values(this.state.users).forEach(u => {
            if (u.id !== this.myId && this.connections[u.id]) renderSingleUser(u, false);
        });
    },

    renderChat: function() {
        const container = document.getElementById('chat-messages');
        if(!container) return;
        container.innerHTML = this.state.chat.map(c => {
            const isMe = c.user === this.myId;
            const u = this.localNicknames[c.user] || (this.state.users[c.user] ? this.state.users[c.user].name : 'Unknown');
            const time = new Date(c.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            return `<div class="chat-msg ${isMe ? 'self' : ''}">
                ${!isMe ? `<strong style="font-size:11px; opacity:0.8; margin-bottom:4px; display:block;">${u}</strong>` : ''}
                ${c.msg}
                <span class="time">${time}</span>
            </div>`;
        }).join('');
        container.scrollTop = container.scrollHeight;
    },

    renderNotes: function() {
        document.querySelectorAll('.column-content').forEach(c => c.innerHTML = '');
        let inProgressCount = 0;
        const notesArr = Object.values(this.state.notes);
        
        // Gravity-Based Sorting: Forces all isPaused: true items to the bottom of the list before priority is calculated
        notesArr.sort((a, b) => {
            const aPaused = a.isPaused ? 1 : 0;
            const bPaused = b.isPaused ? 1 : 0;
            if (aPaused !== bPaused) return aPaused - bPaused;

            const priorityWeight = { urgent: 3, default: 2, low: 1 };
            const aWeight = priorityWeight[a.priority] || 2;
            const bWeight = priorityWeight[b.priority] || 2;
            if (bWeight !== aWeight) return bWeight - aWeight;

            if ((b.orderIndex||0) !== (a.orderIndex||0)) return (b.orderIndex||0) - (a.orderIndex||0);
            return a.timestamps.created - b.timestamps.created;
        });

        notesArr.forEach(note => {
            const col = document.querySelector(`.column-content[data-status="${note.status}"]`);
            if (!col) return;
            if (note.status === 'in-progress' && !note.isPaused) inProgressCount++;

            const el = document.createElement('div');
            el.className = `note priority-${note.priority} status-${note.status} ${note.isPaused ? 'paused' : ''}`;
            el.draggable = true;
            el.id = `note-${note.id}`;
            el.dataset.id = note.id;
            
            if(note.color) el.style.background = note.color;

            let tagsHtml = (note.tags||[]).map(t => `<span class="tag">${t}</span>`).join('');
            let userHtml = '';
            if (note.assignedUser && this.state.users[note.assignedUser] && note.assignedUser !== this.myId) {
                const displayName = this.localNicknames[note.assignedUser] || this.state.users[note.assignedUser].name;
                userHtml = `<div class="user-avatar" style="width:20px;height:20px;font-size:9px;position:absolute;top:10px;right:10px; border:none;">${displayName.charAt(0)}</div>`;
            }

            let progressHtml = '', actionHtml = '', spinnerHtml = '';
            if (note.status === 'in-progress') {
                actionHtml = `<button onclick="app.togglePause('${note.id}', event)" style="padding:4px 8px; font-size:10px; border-radius:4px; margin-right:6px; box-shadow:none;">${note.isPaused ? '▶ Play' : '⏸ Pause'}</button>`;
                
                if(!note.isPaused) {
                    const lClass = note.priority === 'urgent' ? 'l-urgent' : (note.priority === 'low' ? 'l-low' : 'l-default');
                    spinnerHtml = `<div class="mini-loader ${lClass}" style="display:block;"></div>`;
                }

                if(note.assumedTimeSpan) {
                    const textLen = (note.desc?.length || 0);
                    const dots = Math.max(2, Math.min(15, Math.floor(textLen / 20) + 3));
                    const dotSize = 100 / dots;
                    progressHtml = `
                        <div class="progress-wrapper" style="--dot-size: ${dotSize}%">
                            <div class="progress-mask"></div>
                            <div class="progress-fill" id="prog-${note.id}"></div>
                        </div>`;
                }
            }

            const descContent = note.desc ? note.desc : '<div class="empty-desc">+ Add description...</div>';
            
            const cols = ['todo', 'in-progress', document.body.classList.contains('review-enabled')?'review':null, 'done'].filter(Boolean);
            const colIdx = cols.indexOf(note.status);
            let moveBtnHtml = '';
            if(colIdx < cols.length - 1) {
                const nextColName = cols[colIdx + 1];
                const tooltipText = nextColName === 'done' ? 'Complete Task' : `Move to ${nextColName}`;
                moveBtnHtml = `<button class="quick-move-btn" onclick="app.moveNoteNetwork(app.state.notes['${note.id}'], '${nextColName}'); event.stopPropagation();" title="${tooltipText}">></button>`;
            }

            el.innerHTML = `
                ${moveBtnHtml}
                ${userHtml}
                <div class="note-header">
                    <div class="note-subject" id="subj-${note.id}" onclick="app.startQuickEdit(this, '${note.id}', 'subject', event)">${note.subject}</div>
                </div>
                <div class="note-desc ${!note.desc?'empty-desc':''}" id="desc-${note.id}" onclick="app.startQuickEdit(this, '${note.id}', 'desc', event)">${descContent}</div>
                <div class="note-tags">${tagsHtml}</div>
                
                <div class="note-meta">
                    <div style="display:flex; align-items:center; z-index:5;">
                        ${actionHtml}
                        ${note.assumedTimeSpan ? `<span style="opacity:0.7; font-weight:700;">${(note.assumedTimeSpan/3600000).toFixed(1)}h</span>` : ''}
                    </div>
                    ${spinnerHtml}
                </div>
                ${progressHtml}
            `;

            el.ondblclick = (e) => { if(!e.target.isContentEditable) this.openNoteModal(note.id); };
            el.onmouseenter = () => { this.hoveredNoteId = note.id; el.classList.add('hover-focus'); };
            el.onmouseleave = () => { this.hoveredNoteId = null; el.classList.remove('hover-focus'); };
            
            el.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                this.ctxNoteId = note.id;
                const menu = document.getElementById('context-menu');
                menu.style.display = 'flex';
                menu.style.left = e.pageX + 'px';
                menu.style.top = e.pageY + 'px';
            });

            col.appendChild(el);
        });

        document.getElementById('main-progress-loader').style.display = inProgressCount > 0 ? 'block' : 'none';
        this.updateProgressUI();
    },

    // --- QUICK EDIT LOGIC ---
    startQuickEdit: function(el, noteId, field, e) {
        if(e) e.stopPropagation();
        
        if(el.classList.contains('empty-desc')) { el.innerHTML = ''; el.classList.remove('empty-desc'); }
        
        el.contentEditable = true;
        el.classList.add('editing');
        el.focus();
        
        const range = document.createRange();
        const sel = window.getSelection();
        range.selectNodeContents(el);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);

        el.onblur = () => {
            el.contentEditable = false;
            el.classList.remove('editing');
            const note = this.state.notes[noteId];
            if(!note) return;
            const newVal = el.innerText.trim();
            
            if(field === 'subject' && newVal !== note.subject) note.subject = newVal || 'Untitled';
            if(field === 'desc' && newVal !== note.desc) note.desc = newVal;
            
            note.timestamps.lastModified = Date.now();
            this.saveState(); this.broadcast({type:'NOTE_UPDATE', note});
            this.renderNotes();
        };

        el.onkeydown = (ev) => { if(ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); el.blur(); } };
    },

    ctxQuickEdit: function() {
        document.getElementById('context-menu').style.display = 'none';
        const subjEl = document.getElementById(`subj-${this.ctxNoteId}`);
        if(subjEl) this.startQuickEdit(subjEl, this.ctxNoteId, 'subject');
    },
    ctxFullEdit: function() { document.getElementById('context-menu').style.display = 'none'; this.openNoteModal(this.ctxNoteId); },
    ctxDelete: function() { document.getElementById('context-menu').style.display = 'none'; this.deleteNote(this.ctxNoteId); },


    // --- INTERACTIONS ---
    setupPanZoom: function() {
        const container = document.getElementById('board-container');
        container.addEventListener('wheel', (e) => {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                const zoom = Math.exp((e.deltaY < 0 ? 1 : -1) * 0.08);
                this.transform.scale = Math.min(Math.max(0.5, this.transform.scale * zoom), 1.5);
                document.getElementById('canvas-wrapper').style.transform = `translate(${this.transform.x}px, ${this.transform.y}px) scale(${this.transform.scale})`;
            }
        }, { passive: false });

        container.addEventListener('mousedown', (e) => {
            if (e.target.closest('.note') || window.innerWidth < 1024) return;
            this.isPanning = true;
            this.startX = e.clientX - this.transform.x;
            this.startY = e.clientY - this.transform.y;
        });
        window.addEventListener('mousemove', (e) => {
            if (!this.isPanning) return;
            this.transform.x = e.clientX - this.startX;
            this.transform.y = e.clientY - this.startY;
            document.getElementById('canvas-wrapper').style.transform = `translate(${this.transform.x}px, ${this.transform.y}px) scale(${this.transform.scale})`;
        });
        window.addEventListener('mouseup', () => this.isPanning = false);
    },

    getDragAfterElement: function(container, y) {
        const draggableElements = [...container.querySelectorAll('.note:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
            else return closest;
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    },

    setupDragAndDrop: function() {
        let draggedId = null;
        document.addEventListener('dragstart', (e) => {
            const el = e.target.closest('.note');
            if (el && !e.target.isContentEditable) { 
                draggedId = el.dataset.id; 
                const randomRot = (Math.random() - 0.5) * 6;
                el.style.setProperty('--rot', `${randomRot}deg`); 
                el.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move'; 
            }
        });
        document.addEventListener('dragend', (e) => {
            const el = e.target.closest('.note');
            if (el) el.classList.remove('dragging'); 
            draggedId = null;
            document.querySelectorAll('.drop-spacer').forEach(s => s.remove());
        });

        document.querySelectorAll('.column-content').forEach(col => {
            col.addEventListener('dragover', e => { 
                e.preventDefault(); 
                e.dataTransfer.dropEffect = 'move';
                
                const draggingEl = document.querySelector('.dragging');
                if(!draggingEl) return;
                
                let spacer = col.querySelector('.drop-spacer');
                if (!spacer) {
                    document.querySelectorAll('.drop-spacer').forEach(s => s.remove());
                    spacer = document.createElement('div');
                    spacer.className = 'drop-spacer';
                }
                
                const afterElement = this.getDragAfterElement(col, e.clientY);
                if (afterElement == null) col.appendChild(spacer);
                else col.insertBefore(spacer, afterElement);
            });
            
            col.addEventListener('drop', e => {
                e.preventDefault();
                document.querySelectorAll('.drop-spacer').forEach(s => s.remove());
                if (!draggedId) return;
                
                const note = this.state.notes[draggedId];
                const newStatus = col.dataset.status;
                
                const children = Array.from(col.children).filter(c => c.classList.contains('note') || c.classList.contains('drop-spacer'));
                const spacerIndex = children.findIndex(c => c.classList.contains('drop-spacer') || c.id === `note-${draggedId}`);
                
                if(newStatus !== note.status) this.moveNoteNetwork(note, newStatus, false);
                
                const notesInCol = Array.from(col.querySelectorAll('.note')).filter(n => n.dataset.id !== draggedId);
                if (spacerIndex !== -1) {
                    notesInCol.splice(spacerIndex, 0, document.getElementById(`note-${draggedId}`));
                }
                
                notesInCol.forEach((noteEl, index) => {
                    if (noteEl) {
                        const n = this.state.notes[noteEl.dataset.id];
                        if (n) n.orderIndex = notesInCol.length - index;
                    }
                });
                
                note.timestamps.lastModified = Date.now();
                this.saveState(); this.renderNotes();
                this.broadcast({ type: 'NOTE_UPDATE', note });
            });
        });
    },

    moveNoteNetwork: function(note, newStatus, doReorder = true) {
        const oldStatus = note.status;
        if (newStatus === oldStatus && doReorder) return;

        const updateState = () => {
            if (oldStatus === 'in-progress') {
                if (!note.isPaused && note.assumedTimeSpan) note.accumulatedProgressTime += (Date.now() - note.timestamps.inProgress);
                note.isPaused = false;
            }
            if (newStatus === 'in-progress') { note.assignedUser = this.myId; note.timestamps.inProgress = Date.now(); note.isPaused = false; }
            if (newStatus === 'done') note.timestamps.completed = Date.now();

            note.status = newStatus;
            note.timestamps.lastModified = Date.now();
            this.saveState(); this.renderNotes();
            this.broadcast({ type: 'NOTE_UPDATE', note });
        };

        if ((oldStatus === 'done' && newStatus !== 'done') || (oldStatus === 'review' && newStatus === 'in-progress') || (oldStatus === 'in-progress' && newStatus === 'todo')) {
            this.confirm(`Revert task from ${oldStatus.toUpperCase()} to ${newStatus.toUpperCase()}?`, () => {
                note.timestamps.reverted = Date.now();
                updateState();
            });
        } else {
            updateState();
        }
    },

    updateProgressUI: function() {
        Object.values(this.state.notes).forEach(note => {
            if (note.status === 'in-progress' && note.assumedTimeSpan) {
                let elapsed = note.accumulatedProgressTime;
                if (!note.isPaused && note.timestamps.inProgress) elapsed += (Date.now() - note.timestamps.inProgress);
                const percent = Math.min((elapsed / note.assumedTimeSpan) * 100, 100);
                const bar = document.getElementById(`prog-${note.id}`);
                if (bar) bar.style.setProperty('--p', `${percent}%`);
            }
        });
    },

    togglePause: function(noteId, event) {
        event.stopPropagation();
        const note = this.state.notes[noteId];
        if (note.isPaused) { note.isPaused = false; note.timestamps.inProgress = Date.now(); } 
        else { note.isPaused = true; note.accumulatedProgressTime += (Date.now() - note.timestamps.inProgress); }
        note.timestamps.lastModified = Date.now();
        this.saveState(); this.renderNotes(); this.broadcast({ type: 'NOTE_UPDATE', note });
    },

    // --- MODALS ---
    openNoteModal: function(noteId = null) {
        const modal = document.getElementById('modal-overlay');
        const isEditing = noteId && this.state.notes[noteId];
        
        document.getElementById('modal-title').innerText = isEditing ? 'Edit Card' : 'New Card';
        document.getElementById('note-id').value = isEditing ? noteId : '';
        document.getElementById('note-subject').value = isEditing ? this.state.notes[noteId].subject : '';
        document.getElementById('note-desc').value = isEditing ? (this.state.notes[noteId].desc||'') : '';
        document.getElementById('note-priority').value = isEditing ? this.state.notes[noteId].priority : 'default';
        
        const hasTime = isEditing && this.state.notes[noteId].assumedTimeSpan > 0;
        document.getElementById('enable-time').checked = hasTime;
        document.getElementById('note-time').disabled = !hasTime;
        document.getElementById('note-time').value = hasTime ? (this.state.notes[noteId].assumedTimeSpan / 3600000) : '';
        
        const tags = isEditing ? (this.state.notes[noteId].tags||[]) : [];
        Array.from(document.getElementById('note-tags').options).forEach(opt => opt.selected = tags.includes(opt.value));

        this.selectColor(null, isEditing ? (this.state.notes[noteId].color||'') : '');

        modal.style.display = 'flex';
        void modal.offsetWidth; 
        modal.classList.add('active');
        setTimeout(() => document.getElementById('note-subject').focus(), 100);
    },
    
    closeModal: function() { 
        const m = document.getElementById('modal-overlay');
        m.classList.remove('active');
        setTimeout(()=>m.style.display = 'none', 200);
    },

    selectColor: function(element, color) {
        this.selectedColor = color;
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
        if(element) element.classList.add('selected');
        else if(color) document.getElementById('note-color-picker').parentElement.classList.add('selected');
        else document.querySelector('.swatch').classList.add('selected'); 
    },

    saveNote: function() {
        const idInput = document.getElementById('note-id').value;
        const isNew = !idInput;
        const id = isNew ? 'note_' + Date.now() : idInput;
        
        const subj = document.getElementById('note-subject').value.trim();
        if(!subj) return this.toast("Subject is required");

        const tags = Array.from(document.getElementById('note-tags').selectedOptions).map(o => o.value);
        const useTime = document.getElementById('enable-time').checked;
        const hours = parseFloat(document.getElementById('note-time').value) || 0;

        const note = {
            id, subject: subj, desc: document.getElementById('note-desc').value,
            priority: document.getElementById('note-priority').value,
            tags, color: this.selectedColor,
            assumedTimeSpan: (useTime && hours>0) ? hours * 3600000 : null,
            status: isNew ? 'todo' : this.state.notes[id].status,
            assignedUser: isNew ? null : this.state.notes[id].assignedUser,
            accumulatedProgressTime: isNew ? 0 : this.state.notes[id].accumulatedProgressTime,
            isPaused: isNew ? false : this.state.notes[id].isPaused,
            orderIndex: isNew ? 0 : (this.state.notes[id].orderIndex||0),
            timestamps: isNew ? { created: Date.now(), inProgress: null, completed: null, lastModified: Date.now() } 
                              : { ...this.state.notes[id].timestamps, lastModified: Date.now() }
        };

        this.state.notes[id] = note;
        this.saveState(); this.renderNotes(); this.broadcast({ type: 'NOTE_UPDATE', note });
        this.closeModal();
    },

    deleteNote: function(id) {
        this.confirm("Delete this note permanently?", () => {
            delete this.state.notes[id];
            this.saveState(); this.renderNotes();
            this.broadcast({ type: 'NOTE_DELETED', noteId: id });
        });
    },

    // --- UTILS ---
    setupTheme: function() {
        const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    },
    toggleTheme: function() {
        const curr = document.documentElement.getAttribute('data-theme');
        document.documentElement.setAttribute('data-theme', curr === 'dark' ? 'light' : 'dark');
    },
    toggleReviewColumn: function(enabled, save = true) {
        this.state.settings.reviewEnabled = enabled;
        document.body.classList.toggle('review-enabled', enabled);
        if(save) { this.saveState(); this.broadcast({ type: 'FULL_STATE', state: this.state }); }
    },
    toggleChat: function() {
        const panel = document.getElementById('chat-panel');
        panel.classList.toggle('open');
        if(panel.classList.contains('open')) {
            this.unreadChat = 0;
            document.getElementById('chat-badge').style.display = 'none';
            document.getElementById('chat-input').focus();
        }
    },
    sendChat: function() {
        const input = document.getElementById('chat-input');
        if(!input.value.trim()) return;
        const msg = { user: this.myId, msg: input.value.trim(), time: Date.now() };
        this.state.chat.push(msg);
        this.saveState(); this.renderChat(); this.broadcast({ type: 'CHAT', msg });
        input.value = '';
    },
    renameSelf: function() {
        this.promptUser("Profile", "Enter your display name:", this.state.users[this.myId]?.name, val => {
            if (val && val.trim()) {
                this.state.users[this.myId].name = val.trim();
                this.localNicknames[this.myId] = val.trim();
                localStorage.setItem('kanban_nicks', JSON.stringify(this.localNicknames));
                this.saveState(); this.renderUsers(); this.renderChat();
                this.broadcast({ type: 'USER_UPDATE', user: this.state.users[this.myId] });
            }
        });
    },
    toggleLogger: function() {
        const lw = document.getElementById('logger-window');
        lw.style.display = lw.style.display === 'flex' ? 'none' : 'flex';
    },
    copyLogs: function() {
        navigator.clipboard.writeText(document.getElementById('logger-content').innerText);
        this.toast("Logs Copied!");
    },
    exportState: function() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.state));
        const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", `trodo_backup_${Date.now()}.json`); dl.click();
        this.toast("Exported successfully.");
    },
    importState: function(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                this.state = JSON.parse(e.target.result);
                if (!this.state.settings) this.state.settings = { reviewEnabled: false };
                this.saveState(); this.loadState(); this.renderAll(); this.broadcast({ type: 'FULL_STATE', state: this.state });
                this.toast("Imported successfully.");
            } catch (err) { this.toast("Invalid JSON"); }
        };
        reader.readAsText(file);
    }
};

window.onload = () => app.init();
</script>
